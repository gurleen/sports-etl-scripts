selectors:
  - name: post_statcast_ingest
    description: >
      Statcast/Savant-derived marts to rebuild after `etl statcast update-recent`
      (games, game_coverage, daily_game_coverage, statcast_events, abs_challenges).
      PBP season marts are NOT included here — they are built by --select in
      run_mlbam_pbp_season_stats_dbt after `etl pbp update-recent`.
    definition:
      method: tag
      value: post_statcast_ingest
      parents: true

  - name: post_statcast_extra_ingest
    description: Marts that join statcast_extra (rebuild after Savant /gf ingest).
    definition:
      method: tag
      value: post_statcast_extra_ingest
