# Prefect 3 project — keep server and CLI on the same minor version (see docs/orchestration.md).
prefect-version: "3.7.0"
name: etl-scripts

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "/app"

deployments:
  - name: statcast-update-recent
    description: Incremental Statcast append (default schedule mirrors a typical nightly cron).
    tags:
      - statcast
    schedule:
      cron: "0 10 * * *"
      timezone: UTC
    entrypoint: flows/statcast_flow.py:statcast_update_recent
    parameters:
      days: 1
    work_pool:
      name: etl-pool

  - name: statcast-update-full
    description: Full Statcast history from EARLIEST_DATA_DATE through today (manual / rare).
    tags:
      - statcast
    entrypoint: flows/statcast_flow.py:statcast_update_full
    work_pool:
      name: etl-pool

  - name: statcast-season
    description: Statcast for one MLB season (March–November). Override `year` when triggering a run.
    tags:
      - statcast
    entrypoint: flows/statcast_flow.py:statcast_season
    parameters:
      year: 2025
    work_pool:
      name: etl-pool

  - name: statcast-update-date
    description: Statcast ingest for one calendar day (`game_date`, ISO `YYYY-MM-DD`). Manual runs only.
    tags:
      - statcast
    entrypoint: flows/statcast_flow.py:statcast_update_date
    parameters:
      game_date: "2025-06-01"
    work_pool:
      name: etl-pool

  - name: statcast-backfill
    description: Backfill Statcast for season dates in a year with no rows (one game at a time). Override `year`.
    tags:
      - statcast
    entrypoint: flows/statcast_backfill_flow.py:statcast_backfill_flow
    parameters:
      year: 2025
      limit_days: null
      pause_sec: 0.2
    work_pool:
      name: etl-pool

  - name: dbt-rebuild-baseball
    description: Rebuild baseball dbt models (post_statcast_ingest selector). Use force=true to skip change detection.
    tags:
      - dbt
      - warehouse
    entrypoint: flows/dbt_flow.py:dbt_rebuild_baseball_flow
    parameters:
      selector: post_statcast_ingest
      season_year: null
      force: false
    work_pool:
      name: etl-pool

  - name: statcast-extra-ingest-year
    description: Savant `/gf` gamefeed pitch rows for missing `game_pk` values (current calendar year by default).
    tags:
      - statcast
    entrypoint: flows/statcast_extra_flow.py:statcast_extra_ingest_year_flow
    parameters:
      year: null
      days: null
      start_date: null
      end_date: null
      pause_sec: 0.2
    work_pool:
      name: etl-pool

  - name: mlb-schedule-ingest-year
    description: MLB Stats API schedule for one season (`season` year). Replaces `mlb_schedule` rows for that year.
    tags:
      - mlb
      - schedule
    entrypoint: flows/mlb_schedule_flow.py:mlb_schedule_ingest_year_flow
    parameters:
      year: 2025
      sport_id: 1
    work_pool:
      name: etl-pool

  - name: mlbam-pbp-update-recent
    description: MLB Stats API play-by-play for recently-finalized games into retrosheet_plays (source='mlbam'). Nightly.
    tags:
      - mlb
      - pbp
    schedule:
      cron: "30 10 * * *"
      timezone: UTC
    entrypoint: flows/mlbam_pbp_flow.py:mlbam_pbp_update_recent
    parameters:
      days: 3
      year: null
      write_baserunning: true
    work_pool:
      name: etl-pool

  - name: mlbam-pbp-ingest-year
    description: MLB Stats API play-by-play for one season into retrosheet_plays (source='mlbam'). Override `year`; `reload=true` re-fetches all games.
    tags:
      - mlb
      - pbp
    entrypoint: flows/mlbam_pbp_flow.py:mlbam_pbp_ingest_year_flow
    parameters:
      year: 2026
      reload: false
      write_baserunning: true
    work_pool:
      name: etl-pool

  - name: mlb-transactions-update-recent
    description: MLB Stats API transactions for the trailing N days into mlb_transactions (idempotent upsert). Nightly.
    tags:
      - mlb
      - transactions
    schedule:
      cron: "45 10 * * *"
      timezone: UTC
    entrypoint: flows/mlb_transactions_flow.py:mlb_transactions_update_recent
    parameters:
      days: 7
    work_pool:
      name: etl-pool

  - name: mlb-transactions-backfill
    description: MLB Stats API transactions across a historical date range into mlb_transactions. Override `start_date` / `end_date`.
    tags:
      - mlb
      - transactions
    entrypoint: flows/mlb_transactions_flow.py:mlb_transactions_backfill_flow
    parameters:
      start_date: "2021-01-01"
      end_date: null
      chunk_days: 30
    work_pool:
      name: etl-pool

  - name: mlb-roster-entries-update-recent
    description: MLB Stats API roster stints for recently-moved players + open stints into mlb_roster_entries (idempotent upsert). Nightly.
    tags:
      - mlb
      - roster
    schedule:
      cron: "50 10 * * *"
      timezone: UTC
    entrypoint: flows/mlb_roster_entries_flow.py:mlb_roster_entries_update_recent
    parameters:
      days: 7
      max_workers: 8
      pause_sec: 0.0
    work_pool:
      name: etl-pool

  - name: mlb-roster-entries-backfill
    description: MLB Stats API roster stints for every person in mlb_transactions into mlb_roster_entries. Override `limit` for a smoke test; null backfills the whole universe.
    tags:
      - mlb
      - roster
    entrypoint: flows/mlb_roster_entries_flow.py:mlb_roster_entries_backfill_flow
    parameters:
      limit: null
      max_workers: 8
      pause_sec: 0.0
      skip_existing: false
      source_table: mlb_transactions
    work_pool:
      name: etl-pool
